<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Europa Neo — Player Manual" }}</title>
  <link rel="stylesheet" href="{{ '/assets/design.css' | relative_url }}">
</head>
<!--
  Shared dark-slate chrome for the player manual (spec 012, FR-012 / FR-015).
  The body carries the `europa-page` + `europa-stack` catalog classes from the
  vendored `assets/design.css`, so the manual renders in the same visual
  language as the console: dark page background, system-ui type, surface
  plates, and shared spacing — no custom color literals, no theme gem, no CDN.
  `europa-page` sets the page background/foreground via `--europa-*` tokens;
  CSS background propagation paints the full viewport dark even when content is
  shorter than the window.
-->
<body class="europa-page europa-stack">
  {{ content }}
  <!--
    Branded footer (spec 012 addendum T-032, FR-024 / FR-026 / FR-027):
    present on every manual page because this layout wraps `{{ content }}`.
    Styled with `europa-*` design tokens only (no hardcoded color literals —
    the design-system no-literals guard scans docs/manual). The version comes
    from `{{ site.version }}` (docs/manual/_config.yml), which the shared
    version-drift check guards against APP_VERSION (FR-025).
  -->
  <footer style="margin-top: var(--europa-spacing-lg); padding: var(--europa-spacing-md) var(--europa-spacing-lg); border-top: var(--europa-borders-width) var(--europa-borders-style) var(--europa-color-border); background-color: var(--europa-color-surface); color: var(--europa-color-text-muted); font-family: var(--europa-typography-font-stack); font-size: var(--europa-typography-size-xs); display: flex; flex-wrap: wrap; gap: var(--europa-spacing-sm); align-items: center;">
    <span>Europa Neo</span>
    <span>{{ site.version }}</span>
    <a href="https://github.com/shaunburdick/europa-neo" style="color: var(--europa-color-accent); text-decoration: underline;">GitHub</a>
  </footer>
</body>
</html>
