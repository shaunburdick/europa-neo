# Minimal Jekyll configuration for the player manual (spec 012, FR-012 / FR-015).
#
# This file deliberately contains ONLY a `defaults:` block that applies the
# shared `default` layout to every manual page. There is NO `theme:` key — the
# manual's dark-slate chrome is supplied entirely by the vendored stylesheet
# `docs/manual/assets/design.css` (loaded by `_layouts/default.html`), not by a
# Jekyll theme gem or a CDN `<link>` (FR-015). Adding a `theme:` key here would
# violate FR-015 and is intentionally avoided.
#
# The `source: ./docs/manual` scope of `.github/workflows/pages-deploy.yml` is
# untouched — this file lives inside `docs/manual`, so the Pages artifact scope
# remains exactly the manual tree (FR-013).
defaults:
  - scope:
      path: ""
    values:
      layout: default
