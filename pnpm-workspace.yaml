packages:
  - "packages/*"

# pnpm 11 blocks dependency lifecycle scripts by default (supply-chain
# security). Approve esbuild's native postinstall so tsup/vitest can
# bundle and run TS. (v11 syntax: allowBuilds map replaces the v10
# onlyBuiltDependencies list.)
allowBuilds:
  esbuild: true

catalog:
  tsup: ^8.3.5
  vitest: ^4.1.0
  "@biomejs/biome": ^2.0.0
  typescript: ^5.6.0
