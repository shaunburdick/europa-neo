<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Europa Design — Web Component Playground</title>
        <style>
            /* Playground-only layout + inspection aids. These rules are NOT part
               of the @europa/design system; they only frame the showcase so the
               PO can read each component in isolation. The component visuals
               themselves come from src/styles/catalog.css (imported in main.ts). */
            body {
                margin: 0;
                background: #0b0f19;
                color: #e5e7eb;
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            }

            .playground-header {
                max-width: 60rem;
                margin: 0 auto;
                padding: 1.25rem 1.25rem 0.5rem;
            }

            .playground-header h1 {
                margin: 0 0 0.25rem;
                color: #f9fafb;
                font-size: 1.5rem;
            }

            .playground-header p {
                margin: 0;
                color: #9ca3af;
                font-size: 0.9rem;
            }

            #app {
                max-width: 60rem;
                margin: 0 auto;
                padding: 0 1.25rem 3rem;
                display: flex;
                flex-direction: column;
                gap: 2rem;
            }

            .playground-section h2 {
                color: #f9fafb;
                border-bottom: 1px solid #374151;
                padding-bottom: 0.25rem;
            }

            .playground-section > h3 {
                color: #e5e7eb;
                margin: 1.25rem 0 0.5rem;
                font-size: 1.05rem;
            }

            .playground-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem;
                align-items: flex-start;
            }

            .playground-cell {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
            }

            .playground-cell > .playground-label {
                font-size: 0.75rem;
                color: #9ca3af;
            }

            .playground-card {
                padding: 0.75rem;
                background: #111827;
                border: 1px solid #374151;
                border-radius: 6px;
            }

            .playground-swatch-row {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .playground-swatch {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.25rem;
                width: 92px;
            }

            .playground-swatch > .swatch-box {
                width: 100%;
                height: 40px;
                border-radius: 4px;
                border: 1px solid #374151;
            }

            .playground-swatch > .swatch-label {
                font-size: 0.7rem;
                color: #9ca3af;
                text-align: center;
                word-break: break-all;
            }

            /* The modal is position:fixed by the catalog; a transformed ancestor
               establishes a containing block so the open dialog is framed inside
               this box instead of covering the whole viewport. */
            .playground-modal-box {
                position: relative;
                transform: translateZ(0);
                height: 320px;
                border: 1px dashed #374151;
                border-radius: 8px;
                overflow: hidden;
                background: #111827;
            }

            .playground-fog-box {
                position: relative;
                width: 140px;
                height: 90px;
                background: #1f2937;
                border: 1px solid #374151;
                border-radius: 4px;
                overflow: hidden;
            }

            /* The fog-overlay component intentionally renders a transparent,
               zero-size div (its visibility is driven by the host app's own
               board styling). For inspection we give it a visible treatment here
               so the PO can locate the element. This is playground-only CSS. */
            europa-fog-overlay {
                position: absolute;
                inset: 0;
            }

            europa-fog-overlay > div {
                position: absolute;
                inset: 0;
                background: rgba(26, 34, 51, 0.75);
            }
        </style>
    </head>
    <body>
        <header class="playground-header">
            <h1>Europa Design — Web Component Playground</h1>
            <p>
                Visual inspection aid for all 20 shared web components and the token color reference. Edits to
                <code>src/</code> hot-reload instantly via Vite HMR.
            </p>
        </header>
        <main id="app"></main>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
