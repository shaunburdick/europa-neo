<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Europa Design System</title>
        <style>
            /* ── Playground layout (NOT part of @europa/design) ──────────────── */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: #0b0f19;
                color: #e5e7eb;
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                line-height: 1.5;
            }

            /* ── Page header ───────────────────────────────────────────────── */
            .ds-header {
                max-width: 64rem;
                margin: 0 auto;
                padding: 2.5rem 1.5rem 1.5rem;
                border-bottom: 1px solid #1f2937;
            }

            .ds-header h1 {
                margin: 0 0 0.35rem;
                color: #f9fafb;
                font-size: 1.75rem;
                font-weight: 700;
                letter-spacing: -0.01em;
            }

            .ds-header p {
                margin: 0;
                color: #9ca3af;
                font-size: 0.95rem;
                max-width: 42rem;
            }

            /* ── Table of contents ─────────────────────────────────────────── */
            .ds-toc {
                max-width: 64rem;
                margin: 0 auto;
                padding: 1.25rem 1.5rem;
                border-bottom: 1px solid #1f2937;
            }

            .ds-toc h2 {
                margin: 0 0 0.65rem;
                color: #9ca3af;
                font-size: 0.7rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            .ds-toc__list {
                display: flex;
                flex-wrap: wrap;
                gap: 0.35rem 1.25rem;
                list-style: none;
                margin: 0;
                padding: 0;
            }

            .ds-toc__list li {
                margin: 0;
            }

            .ds-toc__list a {
                color: #e5e7eb;
                text-decoration: none;
                font-size: 0.85rem;
                transition: color 0.15s;
            }

            .ds-toc__list a:hover {
                color: #f59e0b;
            }

            .ds-toc__list .ds-toc__sep {
                color: #4b5563;
                user-select: none;
            }

            /* ── Main content area ─────────────────────────────────────────── */
            #app {
                max-width: 64rem;
                margin: 0 auto;
                padding: 0 1.5rem 4rem;
            }

            /* ── Component section ─────────────────────────────────────────── */
            .ds-section {
                padding-top: 2.5rem;
                margin-top: 1rem;
            }

            .ds-section:first-child {
                padding-top: 1.5rem;
            }

            .ds-section__heading {
                display: flex;
                align-items: baseline;
                gap: 0.65rem;
                margin: 0 0 0.25rem;
                color: #f9fafb;
                font-size: 1.25rem;
                font-weight: 700;
                scroll-margin-top: 1rem;
            }

            .ds-section__heading .ds-section__tag {
                font-size: 0.7rem;
                font-weight: 600;
                color: #6b7280;
                background: #1f2937;
                padding: 0.1rem 0.45rem;
                border-radius: 3px;
                white-space: nowrap;
            }

            .ds-section__desc {
                margin: 0 0 1rem;
                color: #9ca3af;
                font-size: 0.875rem;
                max-width: 42rem;
            }

            .ds-section__divider {
                border: none;
                border-top: 1px solid #1f2937;
                margin: 0;
            }

            /* ── Subsection headings ────────────────────────────────────────── */
            .ds-subheading {
                color: #d1d5db;
                margin: 1.25rem 0 0.5rem;
                font-size: 0.95rem;
                font-weight: 600;
            }

            /* ── Grid / cell / label (component demos) ──────────────────────── */
            .playground-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem;
                align-items: flex-start;
            }

            .playground-cell {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
            }

            .playground-cell > .playground-label {
                font-size: 0.7rem;
                color: #6b7280;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            }

            .playground-card {
                padding: 0.75rem;
                background: #111827;
                border: 1px solid #374151;
                border-radius: 6px;
            }

            /* ── Banner framing ──────────────────────────────────────────────── */
            /* `transform: translateZ(0)` creates a containing block for
               `position: fixed` children, scoping the banner to this box
               instead of the viewport.  The wrapper must NOT have
               `overflow: hidden` — the fixed banner is zero-height from the
               flow, so the box would clip it entirely.  `min-height` gives
               the banner room to render within the wrapper. */
            .playground-banner-box {
                position: relative;
                transform: translateZ(0);
                min-height: 2.5rem;
                margin-bottom: 1rem;
                border: 1px dashed #374151;
                border-radius: 6px;
                background: #111827;
            }

            /* ── Swatch row / swatch ────────────────────────────────────────── */
            .playground-swatch-row {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .playground-swatch {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.25rem;
                width: 92px;
            }

            .playground-swatch > .swatch-box {
                width: 100%;
                height: 40px;
                border-radius: 4px;
                border: 1px solid #374151;
            }

            .playground-swatch > .swatch-label {
                font-size: 0.65rem;
                color: #9ca3af;
                text-align: center;
                word-break: break-all;
                line-height: 1.3;
            }

            /* ── Modal framing ──────────────────────────────────────────────── */
            .playground-modal-box {
                position: relative;
                transform: translateZ(0);
                height: 320px;
                border: 1px dashed #374151;
                border-radius: 8px;
                overflow: hidden;
                background: #111827;
            }

            /* ── Fog framing ────────────────────────────────────────────────── */
            .playground-fog-box {
                position: relative;
                width: 140px;
                height: 90px;
                background: #1f2937;
                border: 1px solid #374151;
                border-radius: 4px;
                overflow: hidden;
            }

            europa-fog-overlay {
                position: absolute;
                inset: 0;
            }

            europa-fog-overlay > div {
                position: absolute;
                inset: 0;
                background: rgba(26, 34, 51, 0.75);
            }

            /* ── Token section ──────────────────────────────────────────────── */
            .ds-token-group {
                margin-bottom: 1.5rem;
            }

            .ds-token-group h3 {
                color: #d1d5db;
                margin: 0 0 0.5rem;
                font-size: 0.9rem;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <header class="ds-header">
            <h1>Europa Design System</h1>
            <p>
                A visual catalogue of all 20 shared web components and the design token palette.
                Edit <code>src/</code> and the page hot-reloads via Vite HMR.
            </p>
        </header>
        <nav class="ds-toc" aria-label="Component catalogue">
            <h2>On this page</h2>
            <ul class="ds-toc__list" id="toc"></ul>
        </nav>
        <main id="app"></main>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
