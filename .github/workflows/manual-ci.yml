# Manual CI — verifies the player manual builds cleanly and all links resolve.
#
# Runs on PRs (the `changes` job gates the verify job via a job-level `if:`
# skip, which reports "skipped" and satisfies the required check — see
# docs.github.com troubleshooting-required-status-checks). Does NOT deploy
# — that's pages-deploy.yml's job. This workflow catches broken links, build
# errors, and regressions before merge.
name: Manual CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detects whether this workflow's relevant paths changed on the PR. The
  # verify job gates on this output; when it skips, the check reports
  # "skipped" (a successful status) so the required check is satisfied.
  # This job must NEVER fail: a failure would skip its dependent silently
  # (dependent-job-skip), letting the required check pass without running.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" ]]; then
            # workflow_dispatch: no PR base — run everything.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files="$(git diff --name-only "$base"...HEAD 2>/dev/null)"; then
            # Diff unavailable — conservative: run everything.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(docs/manual/|\.github/workflows/manual-ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Build + link verification
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm + Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Build design package
        run: pnpm --filter @europa/design build

      - name: Build Astro site
        run: pnpm --filter @europa/manual build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('docs/manual/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @europa/manual exec playwright install chromium

      - name: Run Playwright link test
        run: pnpm --filter @europa/manual test:links
