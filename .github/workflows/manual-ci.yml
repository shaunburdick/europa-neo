# Manual CI — verifies the player manual builds cleanly and all links resolve.
#
# Runs on PRs that touch docs/manual/** or this workflow file. Does NOT deploy
# — that's pages-deploy.yml's job. This workflow catches broken links, build
# errors, and regressions before merge.
name: Manual CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/manual/**'
      - '.github/workflows/manual-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build + link verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design package
        run: pnpm --filter @europa/design build

      - name: Build Astro site
        run: pnpm --filter @europa/manual build

      - name: Install Playwright browsers
        run: pnpm --filter @europa/manual exec playwright install chromium

      - name: Run Playwright link test
        run: pnpm --filter @europa/manual test:links
