# Manual CI — verifies the player manual builds cleanly and all links resolve.
#
# Runs on PRs that touch docs/manual/** or this workflow file. Does NOT deploy
# — that's pages-deploy.yml's job. This workflow catches broken links, build
# errors, and regressions before merge.
name: Manual CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/manual/**'
      - '.github/workflows/manual-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build + link verification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm + Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Build design package
        run: pnpm --filter @europa/design build

      - name: Build Astro site
        run: pnpm --filter @europa/manual build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('docs/manual/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @europa/manual exec playwright install chromium

      - name: Run Playwright link test
        run: pnpm --filter @europa/manual test:links
