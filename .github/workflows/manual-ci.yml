# Manual CI — verifies the player manual builds cleanly and all links resolve.
#
# Runs on PRs (the `changes` job gates the verify job via a job-level `if:`
# skip, which reports "skipped" and satisfies the required check — see
# docs.github.com troubleshooting-required-status-checks). Does NOT deploy
# — that's pages-deploy.yml's job. This workflow catches broken links, build
# errors, and regressions before merge.
name: Manual CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detects whether this workflow's relevant paths changed on the PR. The
  # heavy jobs below gate on this output; when they skip, the check reports
  # "skipped" (a successful status) so the required check is satisfied.
  # dorny/paths-filter reads changed files via the REST API on PRs and
  # diffs against the previous commit on push. This job must never fail: a
  # failure would skip its dependents silently (dependent-job-skip).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # dorny/paths-filter: on PRs it reads changed files via the REST API
      # (no git history needed); on push it diffs against the previous
      # commit. Filters mirror the old workflow-level paths lists.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changed:
              - 'docs/manual/**'
              - '.github/workflows/manual-ci.yml'
  verify:
    name: Build + link verification
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    # Browser jobs run in the upstream Playwright image: Chromium and its system
    # libraries come from the image, so nothing installs at run time (008 FR-035/FR-037).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A container job runs as root over a checkout the runner owns, and git
      # refuses to read such a repository; suites that shell out to git need this.
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/build-workspace
        with:
          packages: 'design'
          runtime: none

      - name: Build Astro site
        run: pnpm --filter @europa/manual build

      # Docs-privacy guard (010 FR-014 / NFR-003), same check pages-deploy.yml
      # runs at ship time. Running it here means a credential/identity leak
      # into the manual fails the PR instead of the post-merge Pages deploy.
      - name: Documentation privacy check
        run: node specs/010-public-lobby-match-browser/check-documentation-privacy.mjs

      # Nothing is installed at run time (008 FR-035/FR-037): the image supplies
      # Chromium, and this fails loudly if the tag, CLI, driver or runtime drifts.
      - name: Toolchain and Playwright version agreement
        run: |
          expected=$(pnpm --filter @europa/manual exec node -p "require('@playwright/test/package.json').version")
          cli=$(pnpm --filter @europa/manual exec playwright --version | awk '{print $2}')
          tag=$(sed -n 's/.*mcr\.microsoft\.com\/playwright:v\([0-9.]*\)-noble.*/\1/p' .github/workflows/manual-ci.yml | sort -u)
          test "$tag" = "$expected" && test "$cli" = "$expected"
          pnpm --filter @europa/manual why playwright-core | grep -q "playwright-core@$expected"
          ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* >/dev/null
          node --version
          test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.split('@').pop()")"

      - name: Run Playwright link test
        run: pnpm --filter @europa/manual test:links
