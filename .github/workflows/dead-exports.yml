# Dead Export Gate — fails when a production export under packages/*/src
# has no production reference (008 FR-034, issue #140). Runs unconditionally
# on every PR so the required check always reports; knip runs in production +
# exports-only mode, so tests cannot keep a symbol alive and only export
# findings fail the gate.
name: Dead Export Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Dead export check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Run dead-export gate
        run: pnpm exec knip --production --exports --no-progress --no-tag-hints
