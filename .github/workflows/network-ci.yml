name: Network CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/networking/**'
      - '.github/workflows/network-ci.yml'
      - '.specify/features/004-multiplayer-networking/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'biome.jsonc'
      - 'packages/engine/**'
      - 'packages/fog/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/networking/**'
      - '.github/workflows/network-ci.yml'
      - '.specify/features/004-multiplayer-networking/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'biome.jsonc'
      - 'packages/engine/**'
      - 'packages/fog/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Minimal permissions: contents:read is enough for typecheck/lint/test/build.
# No jobs need write access; we don't push artifacts or publish.
permissions:
  contents: read

jobs:
  network-lint:
    name: Lint (networking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Typecheck (networking)
        run: pnpm --filter @europa/networking typecheck

      - name: Lint (networking)
        run: pnpm --filter @europa/networking lint

      - name: Format check (networking)
        run: pnpm --filter @europa/networking format:check

  network-test:
    name: Test (networking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Test (networking)
        run: pnpm --filter @europa/networking test

  network-coverage:
    name: Coverage gate (networking ≥ 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Coverage (networking)
        run: pnpm --filter @europa/networking coverage

      # Coverage thresholds (80% lines/functions/branches/statements) are
      # enforced by vitest config at packages/networking/vitest.config.ts.
      # The command exits non-zero if any threshold is below 80%.

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: network-coverage
          path: packages/networking/coverage/
          retention-days: 14
