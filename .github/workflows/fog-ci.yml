name: Fog CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/fog/**'
      - '.github/workflows/fog-ci.yml'
      - 'specs/002-fog-of-war-visibility/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'biome.jsonc'
      - 'packages/engine/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/fog/**'
      - '.github/workflows/fog-ci.yml'
      - 'specs/002-fog-of-war-visibility/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'biome.jsonc'
      - 'packages/engine/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Minimal permissions: contents:read is enough for typecheck/lint/test/build.
# No jobs need write access; we don't push artifacts or publish.
permissions:
  contents: read

jobs:
  fog-lint:
    name: Lint (fog)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Typecheck (fog)
        run: pnpm --filter @europa/fog typecheck

      - name: Lint (fog)
        run: pnpm --filter @europa/fog lint

      - name: Format check (fog)
        run: pnpm --filter @europa/fog format:check

  fog-test:
    name: Test (fog)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Test (fog)
        run: pnpm --filter @europa/fog test

  fog-coverage:
    name: Coverage gate (fog ≥ 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Coverage (fog)
        run: pnpm --filter @europa/fog coverage

      # Coverage thresholds (80% lines/functions/branches/statements) are
      # enforced by vitest config at packages/fog/vitest.config.ts.
      # The command exits non-zero if any threshold is below 80%.

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fog-coverage
          path: packages/fog/coverage/
          retention-days: 14
