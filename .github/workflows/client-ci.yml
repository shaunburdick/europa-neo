name: Client CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/console/**'
      - 'packages/core/**'
      - '.github/workflows/client-ci.yml'
      - 'specs/005-client-console/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'biome.jsonc'
      - 'packages/engine/**'
      - 'packages/terrain/**'
      - 'packages/fog/**'
      - 'packages/networking/**'
      - 'packages/matchmaking/**'
      - 'packages/logging/**'
      - 'packages/version/**'
      - 'packages/design/**'
      - 'DESIGN.md'
  # PRs are NOT path-filtered here: every required check must report on every
  # PR. The `changes` job below gates the heavy jobs via job-level `if:`
  # skips, which report "skipped" and satisfy the required check (see
  # docs.github.com troubleshooting-required-status-checks). The push-to-main
  # paths filter above keeps post-merge runs efficient.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Minimal permissions: contents:read is enough for typecheck/lint/test/build.
# No jobs need write access; we don't push artifacts or publish.
permissions:
  contents: read

jobs:
  # Detects whether this workflow's relevant paths changed on the PR. The
  # heavy jobs below gate on this output; when they skip, the check reports
  # "skipped" (a successful status) so the required check is satisfied.
  # dorny/paths-filter reads changed files via the REST API on PRs and
  # diffs against the previous commit on push. This job must never fail: a
  # failure would skip its dependents silently (dependent-job-skip).
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # dorny/paths-filter: on PRs it reads changed files via the REST API
      # (no git history needed); on push it diffs against the previous
      # commit. Filters mirror the old workflow-level paths lists.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changed:
              - 'packages/console/**'
              - 'packages/core/**'
              - '.github/workflows/client-ci.yml'
              - 'specs/005-client-console/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'biome.jsonc'
              - 'packages/engine/**'
              - 'packages/terrain/**'
              - 'packages/fog/**'
              - 'packages/networking/**'
              - 'packages/matchmaking/**'
              - 'packages/logging/**'
              - 'packages/version/**'
              - 'packages/design/**'
              - 'DESIGN.md'
  console-lint:
    name: Lint + typecheck (console)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The console consumes engine/fog/networking TYPES (and the
      # networking seam is runtime-typed); every workspace dep's dist
      # must exist before the console's tsc programs run.
      - uses: ./.github/actions/build-workspace
        with:
          packages: 'version design core engine terrain fog logging networking matchmaking'

      - name: Typecheck (console src)
        run: pnpm --filter @europa/console typecheck

      - name: Lint (console)
        run: pnpm --filter @europa/console lint

      - name: Format check (console)
        run: pnpm --filter @europa/console format:check

      # Design-system drift guards (spec 012 FR-020 / FR-014 / FR-009): the
      # vendored stylesheet must be byte-identical to the built one (G-05),
      # and the console must carry no hardcoded literals outside
      # @europa/design (G-04). Both run after the design + console builds so
      # dist/design.css and the console sources are present.
      - name: Design vendored-asset identity (G-05)
        run: pnpm --filter @europa/design check:vendor-identity

      - name: Console no-literals scan (G-04)
        run: pnpm --filter @europa/design check:no-literals

      - name: Design component-catalog guard (G-10)
        run: pnpm --filter @europa/design check:component-catalog

      - name: Design bundle-size guard (FR-025)
        run: pnpm --filter @europa/design check:bundle-size

      - name: Design drift remediation hint
        if: failure()
        run: |
          echo "::error::Design-system drift detected — run the failing check locally for the offending file:line."
          echo "After a token/class change, rebuild the design package to re-vendor the stylesheet and re-scan:"
          echo "  pnpm --filter @europa/design build"

      - name: Typecheck conformance program
        run: pnpm --filter @europa/console typecheck:conformance

      - name: Orphaned vitest config guard
        run: pnpm guard:config

  design-browser-test:
    name: Browser-mode tests (design)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    # Browser jobs run in the upstream Playwright image: Chromium and its system
    # libraries come from the image, so nothing installs at run time (008 FR-035/FR-037).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A container job runs as root over a checkout the runner owns, and git
      # refuses to read such a repository; suites that shell out to git need this.
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/build-workspace
        with:
          packages: 'design'
          runtime: none

      # Nothing is installed at run time (008 FR-035/FR-037): the image supplies
      # Chromium, and this fails loudly if the tag, CLI, driver or runtime drifts.
      - name: Toolchain and Playwright version agreement
        run: |
          expected=$(pnpm --filter @europa/design exec node -p "require('@playwright/test/package.json').version")
          cli=$(pnpm --filter @europa/design exec playwright --version | awk '{print $2}')
          tag=$(sed -n 's/.*mcr\.microsoft\.com\/playwright:v\([0-9.]*\)-noble.*/\1/p' .github/workflows/client-ci.yml | sort -u)
          test "$tag" = "$expected" && test "$cli" = "$expected"
          pnpm --filter @europa/design why playwright-core | grep -q "playwright-core@$expected"
          ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* >/dev/null
          node --version
          test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.split('@').pop()")"

      - name: Browser-mode tests (design — focus-trap, a11y)
        run: pnpm --filter @europa/design test:browser

  design-coverage:
    name: Coverage gate (design ≥ 80%)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-workspace
        with:
          packages: 'design'

      - name: Coverage (design)
        run: pnpm --filter @europa/design coverage

  version-coverage:
    name: Coverage gate (version ≥ 80%)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-workspace
        with:
          packages: 'version'

      - name: Coverage (version)
        run: pnpm --filter @europa/version coverage

  console-test:
    name: Test suites (console — node)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Integration wave: the full-stack E2E spec boots a real
      # matchmaker + match server in-process (Node side), so
      # @europa/matchmaking's dist must exist before Playwright runs.
      - uses: ./.github/actions/build-workspace
        with:
          packages: 'version design core engine terrain fog logging networking matchmaking'

      # The console's build script runs build-assets.ts which stages
      # brand assets into dist/assets/brand/. host-static.test.ts
      # imports BRAND_MANIFEST and verifies every listed asset is
      # served with the correct MIME type — the test 404s without
      # the staged files.
      - name: Build console (brand asset staging)
        run: pnpm --filter @europa/console build

      - name: Unit tests (reducer + input math + QoL)
        run: pnpm --filter @europa/console test:unit

      - name: Determinism (SC-002 golden fixture)
        run: pnpm --filter @europa/console test:determinism

      - name: Subcell parity vs original
        run: pnpm --filter @europa/console test:parity

      # Quiet-client keepalive vs the idle sweep (Bug 2 regression
      # guard): real sockets + real timers, ~8 s wall time.
      - name: Quiet-client keepalive (idle-sweep guard)
        run: pnpm --filter @europa/console test:keepalive

      # Lobby transport over the real stack (R-010 regression guard):
      # real sockets against the real matchmaking + networking stacks,
      # ~6 s wall time.
      - name: Lobby transport integration (real stack)
        run: pnpm --filter @europa/console test:lobby-integration

  console-e2e:
    name: Test suites (console — e2e)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    # Browser jobs run in the upstream Playwright image: Chromium and its system
    # libraries come from the image, so nothing installs at run time (008 FR-035/FR-037).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 6
    # Fixed at three shards, all required checks (008 FR-046): Playwright splits by
    # test count, and `workers` stays 2 so a leg cannot buy speed with a timeout.
    # fail-fast keeps one red leg from cancelling the others, so every check reports.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A container job runs as root over a checkout the runner owns, and git
      # refuses to read such a repository; suites that shell out to git need this.
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Integration wave: the full-stack E2E spec boots a real
      # matchmaker + match server in-process (Node side), so
      # @europa/matchmaking's dist must exist before Playwright runs.
      - uses: ./.github/actions/build-workspace
        with:
          packages: 'version design core engine terrain fog logging networking matchmaking'
          runtime: none

      # The console's build script runs build-assets.ts which stages
      # brand assets into dist/assets/brand/. host-static.test.ts
      # imports BRAND_MANIFEST and verifies every listed asset is
      # served with the correct MIME type — the test 404s without
      # the staged files.
      - name: Build console (brand asset staging)
        run: pnpm --filter @europa/console build

      # Nothing is installed at run time (008 FR-035/FR-037): the image supplies
      # Chromium, and this fails loudly if the tag, CLI, driver or runtime drifts.
      - name: Toolchain and Playwright version agreement
        run: |
          expected=$(pnpm --filter @europa/console exec node -p "require('@playwright/test/package.json').version")
          cli=$(pnpm --filter @europa/console exec playwright --version | awk '{print $2}')
          tag=$(sed -n 's/.*mcr\.microsoft\.com\/playwright:v\([0-9.]*\)-noble.*/\1/p' .github/workflows/client-ci.yml | sort -u)
          test "$tag" = "$expected" && test "$cli" = "$expected"
          pnpm --filter @europa/console why playwright-core | grep -q "playwright-core@$expected"
          ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* >/dev/null
          node --version
          test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.split('@').pop()")"

      # Includes the selfhost smoke spec, which production-builds the
      # console, scans dist/ for remote URLs, and enforces the Q-P03
      # gzip bundle budget (scripts/test-selfhost.sh).
      - name: E2E tests (Playwright)
        run: pnpm --filter @europa/console exec playwright test --shard=${{ matrix.shard }}/3

      # Contract conformance (reads source directly — no build needed). Unconditional
      # in both legs, so each leg is self-sufficient and cannot hide a gate.
      - name: Contract conformance
        run: |
          pnpm --filter @europa/console exec vitest run --config vitest.config.ts tests/integration/contract-conformance.test.ts

  console-browser:
    # Quoted: the bare scalar is invalid YAML (`: ` reads as a mapping separator);
    # the display name, which is the required-check name, is unchanged.
    name: 'Test suites (console — browser: component/a11y/perf)'
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    # Browser jobs run in the upstream Playwright image: Chromium and its system
    # libraries come from the image, so nothing installs at run time (008 FR-035/FR-037).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A container job runs as root over a checkout the runner owns, and git
      # refuses to read such a repository; suites that shell out to git need this.
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/build-workspace
        with:
          packages: 'version design core engine terrain fog logging networking matchmaking'
          runtime: none

      # The console's build script runs build-assets.ts which stages
      # brand assets into dist/assets/brand/. host-static.test.ts
      # imports BRAND_MANIFEST and verifies every listed asset is
      # served with the correct MIME type — the test 404s without
      # the staged files.
      - name: Build console (brand asset staging)
        run: pnpm --filter @europa/console build

      # Nothing is installed at run time (008 FR-035/FR-037): the image supplies
      # Chromium, and this fails loudly if the tag, CLI, driver or runtime drifts.
      - name: Toolchain and Playwright version agreement
        run: |
          expected=$(pnpm --filter @europa/console exec node -p "require('@playwright/test/package.json').version")
          cli=$(pnpm --filter @europa/console exec playwright --version | awk '{print $2}')
          tag=$(sed -n 's/.*mcr\.microsoft\.com\/playwright:v\([0-9.]*\)-noble.*/\1/p' .github/workflows/client-ci.yml | sort -u)
          test "$tag" = "$expected" && test "$cli" = "$expected"
          pnpm --filter @europa/console why playwright-core | grep -q "playwright-core@$expected"
          ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* >/dev/null
          node --version
          test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.split('@').pop()")"

      - name: Component tests (browser mode)
        run: pnpm --filter @europa/console test:component

      - name: Accessibility acceptance tests (axe-core)
        run: pnpm --filter @europa/console test:a11y

      # Shared runners throttle whole test windows (2026-08-23 incident:
      # paint min-round-median 9.2ms vs 8ms budget, p99 225ms). 2×
      # documented paint-budget headroom; local gates stay strict.
      - name: Perf budgets (SC-003, real Chromium)
        run: pnpm --filter @europa/console test:perf
        env:
          EUROPA_PERF_BUDGET_FACTOR: '2'

  console-coverage:
    name: Coverage gate (console ≥ 80%)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    # Browser jobs run in the upstream Playwright image: Chromium and its system
    # libraries come from the image, so nothing installs at run time (008 FR-035/FR-037).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A container job runs as root over a checkout the runner owns, and git
      # refuses to read such a repository; suites that shell out to git need this.
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The keepalive integration suite imports the matchmaking runtime.
      - uses: ./.github/actions/build-workspace
        with:
          packages: 'version design core engine terrain fog logging networking matchmaking'
          runtime: none

      # Several real-host integration suites exercised by merged coverage serve
      # the production SPA shell. Keep the application build separate from the
      # library emit so coverage starts with the same runtime surface as local
      # validation, including dist/index.html.
      - name: Build console application (coverage host fixtures)
        run: pnpm --filter @europa/console build

      # Nothing is installed at run time (008 FR-035/FR-037): the image supplies
      # Chromium, and this fails loudly if the tag, CLI, driver or runtime drifts.
      - name: Toolchain and Playwright version agreement
        run: |
          expected=$(pnpm --filter @europa/console exec node -p "require('@playwright/test/package.json').version")
          cli=$(pnpm --filter @europa/console exec playwright --version | awk '{print $2}')
          tag=$(sed -n 's/.*mcr\.microsoft\.com\/playwright:v\([0-9.]*\)-noble.*/\1/p' .github/workflows/client-ci.yml | sort -u)
          test "$tag" = "$expected" && test "$cli" = "$expected"
          pnpm --filter @europa/console why playwright-core | grep -q "playwright-core@$expected"
          ls -d "$PLAYWRIGHT_BROWSERS_PATH"/chromium-* >/dev/null
          node --version
          test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.split('@').pop()")"

      # 2× paint-budget headroom for the browser project's perf suite
      # inside merged coverage (shared-runner throttling; see the
      # console-test job's perf step + spec 005 Clarifications v1.1).
      - name: Coverage (console)
        run: pnpm --filter @europa/console coverage
        env:
          EUROPA_PERF_BUDGET_FACTOR: '2'

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-coverage
          path: packages/console/coverage/
          retention-days: 14
