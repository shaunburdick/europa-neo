name: Client CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/console/**'
      - '.github/workflows/client-ci.yml'
      - 'specs/005-client-console/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'biome.jsonc'
      - 'packages/engine/**'
      - 'packages/terrain/**'
      - 'packages/fog/**'
      - 'packages/networking/**'
      - 'packages/matchmaking/**'
      - 'packages/version/**'
      - 'packages/design/**'
      - 'DESIGN.md'
      - 'docs/manual/assets/design.css'
      - 'docs/manual/_layouts/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/console/**'
      - '.github/workflows/client-ci.yml'
      - 'specs/005-client-console/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'biome.jsonc'
      - 'packages/engine/**'
      - 'packages/terrain/**'
      - 'packages/fog/**'
      - 'packages/networking/**'
      - 'packages/matchmaking/**'
      - 'packages/version/**'
      - 'packages/design/**'
      - 'DESIGN.md'
      - 'docs/manual/assets/design.css'
      - 'docs/manual/_layouts/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Minimal permissions: contents:read is enough for typecheck/lint/test/build.
# No jobs need write access; we don't push artifacts or publish.
permissions:
  contents: read

jobs:
  console-lint:
    name: Lint + typecheck (console)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The console consumes engine/fog/networking TYPES (and the
      # networking seam is runtime-typed); every workspace dep's dist
      # must exist before the console's tsc programs run.
      - name: Build @europa/version (workspace dependency)
        run: pnpm --filter @europa/version build

      - name: Build @europa/design (workspace dependency)
        run: pnpm --filter @europa/design build

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/terrain (workspace dependency)
        run: pnpm --filter @europa/terrain build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Build @europa/networking (workspace dependency)
        run: pnpm --filter @europa/networking build

      - name: Build @europa/matchmaking (workspace dependency)
        run: pnpm --filter @europa/matchmaking build

      - name: Typecheck (console src)
        run: pnpm --filter @europa/console typecheck

      - name: Lint (console)
        run: pnpm --filter @europa/console lint

      - name: Format check (console)
        run: pnpm --filter @europa/console format:check

      # Strict program over src/ + the conformance test; verifies the
      # built package surface (needs the library emit below).
      - name: Build console library emit
        run: pnpm --filter @europa/console build:lib

      # Design-system drift guards (spec 012 FR-020 / FR-014 / FR-009): the
      # vendored stylesheet must be byte-identical to the built one (G-05),
      # and the console must carry no hardcoded literals outside
      # @europa/design (G-04). Both run after the design + console builds so
      # dist/design.css and the console sources are present.
      - name: Design vendored-asset identity (G-05)
        run: pnpm --filter @europa/design check:vendor-identity

      - name: Console no-literals scan (G-04)
        run: pnpm --filter @europa/design check:no-literals

      - name: Design drift remediation hint
        if: failure()
        run: |
          echo "::error::Design-system drift detected — run the failing check locally for the offending file:line."
          echo "After a token/class change, rebuild the design package to re-vendor the stylesheet and re-scan:"
          echo "  pnpm --filter @europa/design build"

      - name: Typecheck conformance program
        run: pnpm --filter @europa/console typecheck:conformance

  console-test:
    name: Test suites (console)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @europa/version (workspace dependency)
        run: pnpm --filter @europa/version build

      - name: Build @europa/design (workspace dependency)
        run: pnpm --filter @europa/design build

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/terrain (workspace dependency)
        run: pnpm --filter @europa/terrain build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Build @europa/networking (workspace dependency)
        run: pnpm --filter @europa/networking build

      # Integration wave: the full-stack E2E spec boots a real
      # matchmaker + match server in-process (Node side), so
      # @europa/matchmaking's dist must exist before Playwright runs.
      - name: Build @europa/matchmaking (workspace dependency)
        run: pnpm --filter @europa/matchmaking build

      - name: Unit tests (reducer + input math + QoL)
        run: pnpm --filter @europa/console test:unit

      # Must precede EVERY browser-launching step below (component,
      # a11y, e2e, perf all boot Chromium); vitest browser mode fails
      # with "Executable doesn't exist" without it.
      - name: Install Playwright Chromium
        run: pnpm --filter @europa/console exec playwright install --with-deps chromium

      - name: Component tests (browser mode)
        run: pnpm --filter @europa/console test:component

      - name: Accessibility acceptance tests (axe-core)
        run: pnpm --filter @europa/console test:a11y

      # Includes the selfhost smoke spec, which production-builds the
      # console, scans dist/ for remote URLs, and enforces the Q-P03
      # gzip bundle budget (scripts/test-selfhost.sh).
      - name: E2E tests (Playwright)
        run: pnpm --filter @europa/console test:e2e

      # Shared runners throttle whole test windows (2026-08-23 incident:
      # paint min-round-median 9.2ms vs 8ms budget, p99 225ms). 2×
      # documented paint-budget headroom; local gates stay strict.
      - name: Perf budgets (SC-003, real Chromium)
        run: pnpm --filter @europa/console test:perf
        env:
          EUROPA_PERF_BUDGET_FACTOR: '2'

      - name: Determinism (SC-002 golden fixture)
        run: pnpm --filter @europa/console test:determinism

      - name: Subcell parity vs original
        run: pnpm --filter @europa/console test:parity

      # Quiet-client keepalive vs the idle sweep (Bug 2 regression
      # guard): real sockets + real timers, ~8 s wall time.
      - name: Quiet-client keepalive (idle-sweep guard)
        run: pnpm --filter @europa/console test:keepalive

      # Lobby transport over the real stack (R-010 regression guard):
      # real sockets against the real matchmaking + networking stacks,
      # ~6 s wall time.
      - name: Lobby transport integration (real stack)
        run: pnpm --filter @europa/console test:lobby-integration

      # Contract byte-identity + surface completeness (reads dist/).
      - name: Library emit + contract conformance
        run: |
          pnpm --filter @europa/console build:lib
          pnpm --filter @europa/console exec vitest run --config vitest.config.ts tests/integration/contract-conformance.test.ts

  console-coverage:
    name: Coverage gate (console ≥ 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @europa/version (workspace dependency)
        run: pnpm --filter @europa/version build

      - name: Build @europa/design (workspace dependency)
        run: pnpm --filter @europa/design build

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/terrain (workspace dependency)
        run: pnpm --filter @europa/terrain build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Build @europa/networking (workspace dependency)
        run: pnpm --filter @europa/networking build

      # The keepalive integration suite imports the matchmaking runtime.
      - name: Build @europa/matchmaking (workspace dependency)
        run: pnpm --filter @europa/matchmaking build

      # Merged node+browser coverage (vitest.config.coverage.ts) —
      # thresholds (80% lines/functions/branches/statements) live in
      # that config; the command exits non-zero if any threshold is
      # below 80% (constitution III gate).
      - name: Library emit (conformance coverage suite reads dist/)
        run: pnpm --filter @europa/console build:lib

      # The merged-coverage config (vitest.config.coverage.ts) runs a
      # browser project that launches real Chromium; without the
      # browser install it contributes 0% and merged totals drop
      # below the 80% constitution gate.
      - name: Install Playwright Chromium
        run: pnpm --filter @europa/console exec playwright install --with-deps chromium

      # 2× paint-budget headroom for the browser project's perf suite
      # inside merged coverage (shared-runner throttling; see the
      # console-test job's perf step + spec 005 Clarifications v1.1).
      - name: Coverage (console)
        run: pnpm --filter @europa/console coverage
        env:
          EUROPA_PERF_BUDGET_FACTOR: '2'

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-coverage
          path: packages/console/coverage/
          retention-days: 14
