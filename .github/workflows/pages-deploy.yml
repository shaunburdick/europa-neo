# Pages Deploy — publishes the player manual (docs/manual/) to GitHub Pages.
#
# ONE-TIME PREREQUISITE (FR-016): a repository admin must set
#   Settings → Pages → Build and deployment → Source = "GitHub Actions"
# once, before the first run. The default GITHUB_TOKEN cannot flip this
# setting programmatically. Until it is set, runs FAIL VISIBLY here in
# the Actions tab with a Pages-related error — that failure is the
# signal to flip the setting; no code change is needed. After the one-
# time flip, deployments succeed without further intervention.
#
# Scope guarantees:
#   - Path filter: only pushes touching the manual, its design-owned inputs,
#     or this workflow file trigger a deployment (FR-013).
#   - Artifact scope: the Astro build outputs only rendered manual HTML
#     under docs/manual/dist — never package source, specs, or workflows
#     (FR-015).
#   - Permissions: least privilege — contents:read at the top level;
#     only the deploy job elevates to pages:write + id-token:write,
#     which the OIDC-verified Pages deployment requires (FR-014).
name: Pages Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/manual/**'
      - 'docs/manual/assets/design.css'
      - 'docs/manual/_layouts/**'
      - 'DESIGN.md'
      - 'packages/design/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

# Minimal by default; the deploy job elevates only what Pages needs.
permissions:
  contents: read

# Serialize deployments: a rapid merge sequence must not interleave
# deploys. Never cancel an in-flight deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build manual site (Astro)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The design distribution is the only approved source for generated
      # brand assets. Stage it before the manual build so a clean checkout
      # cannot rely on an ignored or stale local dist tree. The explicit
      # stage is intentionally retained even though design build finalization
      # also invokes it: both commands are idempotent and make this boundary
      # auditable in the Pages workflow.
      - name: Build @europa/design
        run: pnpm --filter @europa/design build

      - name: Stage brand assets for the manual
        run: pnpm --filter @europa/design stage:manual

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Astro site
        run: pnpm --filter @europa/manual build

      # Docs-privacy guard (010 FR-014 / NFR-003): the manual is published
      # here, so the privacy check runs at the exact point it ships. Fails
      # the deploy if any private-match or secret-share material leaks into
      # the public manual.
      - name: Documentation privacy check
        run: node specs/010-public-lobby-match-browser/check-documentation-privacy.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/manual/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
