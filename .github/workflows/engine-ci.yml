name: Engine CI

on:
  push:
    branches: [001-europa-core, main]
  pull_request:
    branches: [001-europa-core, main]

# Minimal permissions: contents:read is enough for typecheck/lint/test/build.
# No jobs need write access; we don't push artifacts or publish.
permissions:
  contents: read

jobs:
  engine-lint:
    name: Lint (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (engine)
        run: pnpm --filter @europa/engine typecheck

      - name: Lint (engine)
        run: pnpm --filter @europa/engine lint

      - name: Format check (engine)
        run: pnpm --filter @europa/engine format:check

  engine-test:
    name: Test (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (engine)
        run: pnpm --filter @europa/engine test

  engine-coverage:
    name: Coverage gate (engine ≥ 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Coverage (engine)
        run: pnpm --filter @europa/engine coverage

      # Coverage thresholds (80% lines/functions/branches/statements) are
      # enforced by vitest config at packages/engine/vitest.config.ts.
      # The command exits non-zero if any threshold is below 80%.

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: engine-coverage
          path: packages/engine/coverage/
          retention-days: 14
