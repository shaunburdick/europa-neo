# Contract Guard — fails on any unreferenced .ts file under
# specs/**/contracts/ (008 FR-033, issue #145 AC-3). Path-gated so the
# <10s static check only runs where it can regress. The `changes` job
# gates the verify job via a job-level `if:` skip, which reports
# "skipped" and satisfies the required check (see
# docs.github.com troubleshooting-required-status-checks).
name: Contract Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'specs/**'
      - 'scripts/check-referenced-contract-files.ts'
      - 'scripts/verify.sh'
      - '.github/workflows/contract-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detects whether this workflow's relevant paths changed on the PR. The
  # heavy job below gates on this output; when it skips, the check reports
  # "skipped" (a successful status) so the required check is satisfied.
  # dorny/paths-filter reads changed files via the REST API on PRs and
  # diffs against the previous commit on push. This job must never fail: a
  # failure would skip its dependents silently (dependent-job-skip).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # dorny/paths-filter: on PRs it reads changed files via the REST API
      # (no git history needed); on push it diffs against the previous
      # commit. Filters mirror the workflow-level paths lists above.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changed:
              - 'specs/**'
              - 'scripts/check-referenced-contract-files.ts'
              - 'scripts/verify.sh'
              - '.github/workflows/contract-guard.yml'

  verify:
    name: Referenced contract file check
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Run referenced-contract-file guard
        run: pnpm exec tsx scripts/check-referenced-contract-files.ts
