name: Version Drift

# FR-009 CI half: guards every shared app-version surface. The push-to-main
# paths filter keeps post-merge runs efficient (drift among the guarded
# surfaces is impossible if none of them changed). PRs are NOT path-filtered:
# this check is required to pass before merge, so it must report on every PR.
# The `changes` job below gates the drift check via a job-level `if:` skip,
# which reports "skipped" and satisfies the required check (see
# docs.github.com troubleshooting-required-status-checks).
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'packages/**/package.json'
      - 'packages/design/package.json'
      - 'packages/design/src/**'
      - 'packages/version/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'docs/manual/src/pages/index.mdx'
      - 'docs/manual/src/layouts/ManualLayout.astro'
      - '.github/workflows/version-drift.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Minimal permissions: contents:read is enough for the drift check.
# No jobs need write access; we don't push artifacts or publish.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" ]]; then
            # push to main / workflow_dispatch: no PR base — run everything.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files="$(git diff --name-only "$base"...HEAD 2>/dev/null)"; then
            # Diff unavailable — conservative: run everything.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(package\.json$|packages/design/src/|packages/version/|README\.md$|DESIGN\.md$|docs/manual/src/pages/index\.mdx$|docs/manual/src/layouts/ManualLayout\.astro$|\.github/workflows/version-drift\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  version-drift:
    name: Shared app version drift check
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      # Exits non-zero and names EVERY disagreeing file when APP_VERSION,
      # any workspace package.json version, the README header / manual
      # index footer version strings, or the DESIGN.md version header
      # (spec 012 FR-020 / G-06) drift apart. Reads packages/version/src
      # directly via tsx — no workspace builds needed.
      - name: Version drift check (FR-009 / FR-020)
        run: pnpm version:check

      # Actionable remediation: the check above already names every
      # disagreeing file on stderr; this step points the maintainer at the
      # one lockstep bump convention when the job fails (T-021).
      - name: Version drift remediation hint
        if: failure()
        run: |
          echo "::error::Version drift detected — run 'pnpm version:check' locally to list every disagreeing file."
          echo "Bump every guarded surface in ONE lockstep commit (spec 009 FR-009 / spec 012 FR-020):"
          echo "  packages/version/src/app-version.ts (APP_VERSION), every packages/*/package.json#version, README.md, docs/manual/src/pages/index.mdx, docs/manual/src/layouts/ManualLayout.astro, and DESIGN.md."
          echo "After a token/class change, refresh the vendored stylesheet with: pnpm --filter @europa/design build"
