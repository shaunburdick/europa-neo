name: Version Drift

# FR-009 CI half: guards every shared app-version surface. The paths
# filter IS the correctness argument — if none of these changed, drift
# among them is impossible; if any changes, the check runs.
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'packages/**/package.json'
      - 'packages/design/package.json'
      - 'packages/design/src/**'
      - 'packages/version/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'docs/manual/index.md'
      - 'docs/manual/_config.yml'
      - 'docs/manual/assets/design.css'
      - '.github/workflows/version-drift.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'packages/**/package.json'
      - 'packages/design/package.json'
      - 'packages/design/src/**'
      - 'packages/version/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'docs/manual/index.md'
      - 'docs/manual/_config.yml'
      - 'docs/manual/assets/design.css'
      - '.github/workflows/version-drift.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Minimal permissions: contents:read is enough for the drift check.
# No jobs need write access; we don't push artifacts or publish.
permissions:
  contents: read

jobs:
  version-drift:
    name: Shared app version drift check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exits non-zero and names EVERY disagreeing file when APP_VERSION,
      # any workspace package.json version, the README header / manual
      # index footer version strings, or the DESIGN.md version header
      # (spec 012 FR-020 / G-06) drift apart. Reads packages/version/src
      # directly via tsx — no workspace builds needed.
      - name: Version drift check (FR-009 / FR-020)
        run: pnpm version:check

      # Actionable remediation: the check above already names every
      # disagreeing file on stderr; this step points the maintainer at the
      # one lockstep bump convention when the job fails (T-021).
      - name: Version drift remediation hint
        if: failure()
        run: |
          echo "::error::Version drift detected — run 'pnpm version:check' locally to list every disagreeing file."
          echo "Bump every guarded surface in ONE lockstep commit (spec 009 FR-009 / spec 012 FR-020):"
          echo "  packages/version/src/app-version.ts (APP_VERSION), every packages/*/package.json#version, README.md, docs/manual/index.md, docs/manual/_config.yml, and DESIGN.md."
          echo "After a token/class change, refresh the vendored stylesheet with: pnpm --filter @europa/design build"
