name: Terrain CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/terrain/**'
      - 'packages/core/**'
      - '.github/workflows/terrain-ci.yml'
      - 'specs/003-procedural-terrain-generation/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'biome.jsonc'
      - 'packages/engine/**'
  # PRs are NOT path-filtered here: every required check must report on every
  # PR. The `changes` job below gates the heavy jobs via job-level `if:`
  # skips, which report "skipped" and satisfy the required check (see
  # docs.github.com troubleshooting-required-status-checks). The push-to-main
  # paths filter above keeps post-merge runs efficient.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Minimal permissions: contents:read is enough for typecheck/lint/test/build.
# No jobs need write access; we don't push artifacts or publish.
permissions:
  contents: read

jobs:
  # Detects whether this workflow's relevant paths changed on the PR. The
  # heavy jobs below gate on this output; when they skip, the check reports
  # "skipped" (a successful status) so the required check is satisfied.
  # This job must NEVER fail: a failure would skip its dependents silently
  # (dependent-job-skip), letting required checks pass without running.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" ]]; then
            # push to main / workflow_dispatch: no PR base — run everything.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files="$(git diff --name-only "$base"...HEAD 2>/dev/null)"; then
            # Diff unavailable — conservative: run everything.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(packages/(terrain|core|engine)/|specs/003-procedural-terrain-generation/|\.github/workflows/terrain-ci\.yml$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|package\.json$|tsconfig\.base\.json$|biome\.jsonc$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  terrain-lint:
    name: Lint (terrain)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Build @europa/core (workspace dependency)
        run: pnpm --filter @europa/core build

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Typecheck (terrain)
        run: pnpm --filter @europa/terrain typecheck

      - name: Lint (terrain)
        run: pnpm --filter @europa/terrain lint

      - name: Format check (terrain)
        run: pnpm --filter @europa/terrain format:check

  terrain-test:
    name: Test (terrain)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Build @europa/core (workspace dependency)
        run: pnpm --filter @europa/core build

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Test (terrain)
        run: pnpm --filter @europa/terrain test

  terrain-coverage:
    name: Coverage gate (terrain ≥ 80%)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Build @europa/core (workspace dependency)
        run: pnpm --filter @europa/core build

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Coverage (terrain)
        run: pnpm --filter @europa/terrain coverage

      # Coverage thresholds (80% lines/functions/branches/statements) are
      # enforced by vitest config at packages/terrain/vitest.config.ts.
      # The command exits non-zero if any threshold is below 80%.

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terrain-coverage
          path: packages/terrain/coverage/
          retention-days: 14
