# Publishes the single-port deployment image to GHCR.
#
# Topology: one http.Server on HOST_PORT serving static UI + /version + WS
# upgrades — see Dockerfile header + docker-compose.yml header + FR-017
# ("one http.Server, one EXPOSE, one port mapping, same-origin WS").
#
# Platforms: linux/amd64 ONLY — amd64-only for now, arm64 in future issue
# per 2026-08-26 gate (plan D8 / research Finding 4). A future issue may add
# arm64 as a non-blocking leg; until then no arm64 matrix exists so amd64
# cannot be blocked by emulation.

name: Docker

on:
    push:
        branches: [main]
        tags:
            - "v*.*.*"
        paths-ignore:
            - "**.md"
            - "specs/**"
            - ".specify/**"
            - "LICENSE"
            - ".vscode/**"
            - "docs/**"
            - "europa-source/**"
            - ".opencode/**"
            - ".github/workflows/engine-ci.yml"
            - ".github/workflows/fog-ci.yml"
            - ".github/workflows/terrain-ci.yml"
            - ".github/workflows/network-ci.yml"
            - ".github/workflows/matchmaking-ci.yml"
            - ".github/workflows/client-ci.yml"
            - ".github/workflows/version-drift.yml"
            - ".github/workflows/pages-deploy.yml"
            - ".github/workflows/release.yml"
    pull_request:
        branches: [main]
        paths-ignore:
            - "**.md"
            - "specs/**"
            - ".specify/**"
            - "LICENSE"
            - ".vscode/**"
            - "docs/**"
            - "europa-source/**"
            - ".opencode/**"
            - ".github/workflows/engine-ci.yml"
            - ".github/workflows/fog-ci.yml"
            - ".github/workflows/terrain-ci.yml"
            - ".github/workflows/network-ci.yml"
            - ".github/workflows/matchmaking-ci.yml"
            - ".github/workflows/client-ci.yml"
            - ".github/workflows/version-drift.yml"
            - ".github/workflows/pages-deploy.yml"
            - ".github/workflows/release.yml"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    validate:
        name: Validate Docker Compose and semantic routes
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Run Docker smoke test
              run: ./scripts/docker-smoke.sh

    build-amd64:
        name: Build and Push Docker Image (linux/amd64)
        needs: [validate]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            packages: write
            attestations: write
            id-token: write
        timeout-minutes: 30
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: "24"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
              with:
                  driver-opts: |
                      image=moby/buildkit:latest
                      network=host

            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha,prefix={{branch}}-,enable={{is_default_branch}}
                      type=raw,value=latest,enable={{is_default_branch}}
                  labels: |
                      org.opencontainers.image.title=Europa Neo
                      org.opencontainers.image.description=Europa Neo — real-time multiplayer nanobot warfare on Jupiter's moon Europa
                      org.opencontainers.image.vendor=Shaun Burdick

            - name: Build and push Docker image by digest
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  labels: ${{ steps.meta.outputs.labels }}
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
                  cache-from: type=gha,scope=build-linux/amd64
                  cache-to: type=gha,mode=max,scope=build-linux/amd64
                  build-args: |
                      BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
                      VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
                      REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
                  provenance: mode=max
                  sbom: false

            - name: Export digest
              if: github.event_name != 'pull_request'
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: digests-linux-amd64
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

            - name: Generate SBOM
              if: github.event_name != 'pull_request'
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
              with:
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
                  format: spdx-json
                  output-file: sbom.spdx.json

            - name: Upload SBOM
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sbom-amd64
                  path: sbom.spdx.json
                  retention-days: 90

    push-image:
        name: Push Docker Image Tags
        needs: [build-amd64]
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request'
        permissions:
            contents: read
            packages: write
        steps:
            - name: Download digests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha,prefix={{branch}}-,enable={{is_default_branch}}
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Create and push image tags
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
              env:
                  DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
