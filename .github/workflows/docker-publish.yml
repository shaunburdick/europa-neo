name: Docker Publish

# Publishes the single-port deployment image to GHCR.
#
# Topology: one http.Server on HOST_PORT serving static UI + /version + WS
# upgrades — see Dockerfile header + docker-compose.yml header + FR-017
# ("one http.Server, one EXPOSE, one port mapping, same-origin WS").
#
# Platforms: linux/amd64 ONLY — amd64-only for now, arm64 in future issue
# per 2026-08-26 gate (plan D8 / research Finding 4). A future issue may add
# arm64 as a non-blocking leg; until then no arm64 matrix exists so amd64
# cannot be blocked by emulation.
#
# Divergence from release.yml: this workflow INCLUDES itself in its paths
# filter (ghcr-publish contract). A Dockerfile/compose change landing via
# this file IS deployable and never spurious, unlike a version-bump file.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - '!**/*.md'
  workflow_dispatch:

# Never publish from forks — GHCR push would fail and leak intent.
# Guarded at job level via `if: github.repository == 'shaunburdick/europa-neo'`.

# Minimal push permissions: contents:read to fetch tags, packages:write to
# push to ghcr.io. No id-token unless SLSA provenance is enabled.
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish GHCR image
    if: github.repository == 'shaunburdick/europa-neo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/shaunburdick/europa-neo
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}

      - name: Build image (load for verification)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false

      - name: Verify image and log size
        run: |
          set -euo pipefail
          # Canonical APP_VERSION is the single source of truth for tags and /version.
          APP_VERSION="$(sed -nE "s/^[[:space:]]*export const APP_VERSION = '([^']+)';/\1/p" packages/version/src/app-version.ts | head -n1)"
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Could not extract APP_VERSION"
            exit 1
          fi
          echo "Canonical APP_VERSION: $APP_VERSION"
          # Pick the first produced tag (edge or versioned) for local verification.
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1 | tr -d '[:space:]')"
          if [ -z "$IMAGE" ]; then
            IMAGE="ghcr.io/shaunburdick/europa-neo:edge"
          fi
          echo "Verifying image: $IMAGE"
          echo "Docker images size:"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E 'europa-neo' || docker images
          # Run detached on a host port distinct from the runner's services.
          VERIFY_PORT=18080
          CONTAINER_ID="$(docker run -d -p ${VERIFY_PORT}:8080 -e HOST_PORT=8080 -e HOST_BIND_HOST=0.0.0.0 -e HOST_PUBLIC_HOST=localhost "$IMAGE")"
          echo "Started container $CONTAINER_ID on port $VERIFY_PORT"
          cleanup() {
            docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # Wait for /version to become reachable (up to 15s).
          for i in $(seq 1 15); do
            if curl -fsS "http://localhost:${VERIFY_PORT}/version" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "GET /version response:"
          curl -fsS "http://localhost:${VERIFY_PORT}/version" | tee /tmp/version.json
          echo ""
          if ! jq -e --arg v "$APP_VERSION" '.appVersion == $v' /tmp/version.json >/dev/null; then
            echo "::error::/version appVersion mismatch — expected $APP_VERSION"
            cat /tmp/version.json
            exit 1
          fi
          echo "✓ /version appVersion matches $APP_VERSION"
          # helloAck.appVersion check: open a WS, send hello, assert appVersion in ack.
          # Use node with ws package from the repo (installed via pnpm) for a lightweight check.
          node -e "
            const WebSocket = require('ws');
            const APP_VERSION = process.env.APP_VERSION;
            const port = process.env.VERIFY_PORT;
            const ws = new WebSocket('ws://localhost:' + port);
            let done = false;
            const timeout = setTimeout(() => { if (!done) { console.error('helloAck timeout'); process.exit(1); } }, 5000);
            ws.on('open', () => ws.send(JSON.stringify({ type: 'hello', version: 1, seq: 1, payload: { protocolVersion: 1 } })));
            ws.on('message', (data) => {
              try {
                const env = JSON.parse(String(data));
                if (env.type === 'helloAck') {
                  const av = env.payload && env.payload.appVersion;
                  if (av !== APP_VERSION) {
                    console.error('helloAck appVersion mismatch: expected ' + APP_VERSION + ' got ' + av);
                    process.exit(1);
                  }
                  console.log('✓ helloAck appVersion matches ' + APP_VERSION);
                  done = true;
                  clearTimeout(timeout);
                  ws.close();
                  setTimeout(() => process.exit(0), 300);
                }
              } catch (e) { console.error(e); process.exit(1); }
            });
            ws.on('error', (e) => { console.error('ws error', e); process.exit(1); });
          " APP_VERSION="$APP_VERSION" VERIFY_PORT="$VERIFY_PORT"
          echo "Verification complete — image is good to push."

      - name: Push image to GHCR
        if: github.repository == 'shaunburdick/europa-neo'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
