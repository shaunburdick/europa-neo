name: Lobby N-Player CI

# Feature 012 (3–4 player end-to-end) cross-cutting gate.
#
# Path-gated on the packages + surfaces that the N-player feature touches
# (spec 012 §Dependencies & Cross-Spec Impact, and the T032 task brief):
#   - packages/matchmaking, terrain, fog, networking, console
#   - packages/console/scripts/host.ts (single-port host flags, FR-011)
#   - specs/012-*/** (feature spec/plan/tasks)
#   - docs/manual/** (FR-013 manual sync)
#
# FR-012 conformance: this workflow is a FEATURE gate, not a version-drift
# listener. It does NOT watch the version-lockstep surfaces that
# version-drift.yml owns (package.json, packages/version/**, README.md) — so
# a pure version bump cannot double-fire a second drift check. The
# `version:check` + docs-privacy steps below are in-job GUARDS required by
# spec 012 SC-009, not a competing trigger. No version bump is introduced or
# required by this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'packages/matchmaking/**'
      - 'packages/terrain/**'
      - 'packages/fog/**'
      - 'packages/networking/**'
      - 'packages/console/**'
      - 'packages/console/scripts/host.ts'
      - 'specs/012-*/**'
      - 'docs/manual/**'
      - '.github/workflows/lobby-n-players-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/matchmaking/**'
      - 'packages/terrain/**'
      - 'packages/fog/**'
      - 'packages/networking/**'
      - 'packages/console/**'
      - 'packages/console/scripts/host.ts'
      - 'specs/012-*/**'
      - 'docs/manual/**'
      - '.github/workflows/lobby-n-players-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Check-only workflow: no job needs write access. contents:read is the
# least-privilege default; we never push, publish, or mint releases.
permissions:
  contents: read

jobs:
  lobby-n-players:
    name: Lobby 3–4 player support gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1) Typecheck — root script builds all packages, then typechecks all.
      - name: Typecheck
        run: pnpm typecheck

      # 2) Lint — root script lints all packages.
      - name: Lint
        run: pnpm lint

      # 3) Test + coverage gate for the in-scope packages that actually
      #    changed. Uniform `vitest run --coverage` is used (never the bare
      #    `test` script, which is watch-mode for the console) and enforces
      #    each package's configured ≥80% thresholds (constitution III).
      #    Detection falls back to the full in-scope surface when the diff
      #    cannot be resolved (e.g. docs-only change) so the gate stays
      #    meaningful.
      - name: Determine touched in-scope packages
        id: touched
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          CHANGED=""
          if git rev-parse --quiet --verify "$BASE^{commit}" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || true)
          fi
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi
          echo "Changed files:"; echo "$CHANGED"
          PKGS=""
          if echo "$CHANGED" | grep -q '^packages/matchmaking/'; then PKGS="$PKGS matchmaking"; fi
          if echo "$CHANGED" | grep -q '^packages/terrain/';     then PKGS="$PKGS terrain"; fi
          if echo "$CHANGED" | grep -q '^packages/fog/';         then PKGS="$PKGS fog"; fi
          if echo "$CHANGED" | grep -q '^packages/networking/';  then PKGS="$PKGS networking"; fi
          if echo "$CHANGED" | grep -q '^packages/console/';     then PKGS="$PKGS console"; fi
          if [ -z "$PKGS" ]; then
            PKGS="matchmaking terrain fog networking console"
          fi
          echo "pkgs=$PKGS" >> "$GITHUB_OUTPUT"

      - name: Test + coverage gate (touched packages, ≥80%)
        run: |
          set -euo pipefail
          for p in ${{ steps.touched.outputs.pkgs }}; do
            echo "::group::@europa/$p — test + coverage"
            pnpm --filter "@europa/$p" exec vitest run --coverage
            echo "::endgroup::"
          done

      # 4) Full-stack N-player E2E (Playwright). Mirrors client-ci: build
      #    the workspace deps the console dev server resolves, install
      #    Chromium, then run ONLY the 012 harness. The match server inside
      #    the spec binds 127.0.0.1:0 (ephemeral port) per 011 FR-009 — the
      #    Playwright webServer boots the Vite dev server on :5173.
      - name: Build workspace dependencies
        run: |
          pnpm --filter @europa/version build
          pnpm --filter @europa/engine build
          pnpm --filter @europa/terrain build
          pnpm --filter @europa/fog build
          pnpm --filter @europa/networking build
          pnpm --filter @europa/matchmaking build

      - name: Install Playwright Chromium
        run: pnpm --filter @europa/console exec playwright install --with-deps chromium

      - name: E2E — full-stack N-player (3 & 4)
        run: pnpm --filter @europa/console exec playwright test tests/e2e/full-stack-n-players.spec.ts

      # 5) Version lockstep (009 FR-009) + docs privacy (010 FR-014). Guards
      #    only — see header note on FR-012 conformance (no second
      #    version-drift listener, no version bump).
      - name: Version lockstep check
        run: pnpm version:check

      - name: Documentation privacy check
        run: node specs/010-public-lobby-match-browser/check-documentation-privacy.mjs
