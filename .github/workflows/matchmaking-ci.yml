name: Matchmaking CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/matchmaking/**'
      - '.github/workflows/matchmaking-ci.yml'
      - '.specify/features/006-match-lifecycle-matchmaking/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'packages/engine/**'
      - 'packages/terrain/**'
      - 'packages/fog/**'
      - 'packages/networking/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/matchmaking/**'
      - '.github/workflows/matchmaking-ci.yml'
      - '.specify/features/006-match-lifecycle-matchmaking/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'packages/engine/**'
      - 'packages/terrain/**'
      - 'packages/fog/**'
      - 'packages/networking/**'

# Minimal permissions: contents:read is enough for typecheck/lint/test/build.
# No jobs need write access; we don't push artifacts or publish.
permissions:
  contents: read

jobs:
  matchmaking-lint:
    name: Lint (matchmaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Matchmaking runtime-imports @europa/engine + @europa/terrain and
      # type-imports @europa/networking; build every workspace dep's dist
      # before touching the package.
      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/terrain (workspace dependency)
        run: pnpm --filter @europa/terrain build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Build @europa/networking (workspace dependency)
        run: pnpm --filter @europa/networking build

      - name: Typecheck (matchmaking)
        run: pnpm --filter @europa/matchmaking typecheck

      - name: Lint (matchmaking)
        run: pnpm --filter @europa/matchmaking lint

      - name: Format check (matchmaking)
        run: pnpm --filter @europa/matchmaking format:check

  matchmaking-test:
    name: Test (matchmaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/terrain (workspace dependency)
        run: pnpm --filter @europa/terrain build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Build @europa/networking (workspace dependency)
        run: pnpm --filter @europa/networking build

      - name: Test (matchmaking)
        run: pnpm --filter @europa/matchmaking test

      # Explicit gates so a missing/renamed script fails loudly in CI
      # even if the umbrella `test` glob ever drifts.
      - name: Conformance (upstream shape drift catch)
        run: pnpm --filter @europa/matchmaking test:conformance

      - name: 'Soak (SC-005: 50 cycles, no leaks)'
        run: pnpm --filter @europa/matchmaking test:soak

  matchmaking-coverage:
    name: Coverage gate (matchmaking ≥ 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/terrain (workspace dependency)
        run: pnpm --filter @europa/terrain build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Build @europa/networking (workspace dependency)
        run: pnpm --filter @europa/networking build

      - name: Coverage (matchmaking)
        run: pnpm --filter @europa/matchmaking test:coverage

      # Coverage thresholds (80% lines/functions/branches/statements) are
      # enforced by vitest config at packages/matchmaking/vitest.config.ts.
      # The command exits non-zero if any threshold is below 80%.

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: matchmaking-coverage
          path: packages/matchmaking/coverage/
          retention-days: 14
