name: Matchmaking CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/matchmaking/**'
      - 'packages/core/**'
      - '.github/workflows/matchmaking-ci.yml'
      - 'specs/006-match-lifecycle-matchmaking/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'biome.jsonc'
      - 'packages/engine/**'
      - 'packages/terrain/**'
      - 'packages/networking/**'
      - 'packages/logging/**'
      - 'packages/version/**'
  # PRs are NOT path-filtered here: every required check must report on every
  # PR. The `changes` job below gates the heavy jobs via job-level `if:`
  # skips, which report "skipped" and satisfy the required check (see
  # docs.github.com troubleshooting-required-status-checks). The push-to-main
  # paths filter above keeps post-merge runs efficient.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Minimal permissions: contents:read is enough for typecheck/lint/test/build.
# No jobs need write access; we don't push artifacts or publish.
permissions:
  contents: read

jobs:
  # Detects whether this workflow's relevant paths changed on the PR. The
  # heavy jobs below gate on this output; when they skip, the check reports
  # "skipped" (a successful status) so the required check is satisfied.
  # dorny/paths-filter reads changed files via the REST API on PRs and
  # diffs against the previous commit on push. This job must never fail: a
  # failure would skip its dependents silently (dependent-job-skip).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # dorny/paths-filter: on PRs it reads changed files via the REST API
      # (no git history needed); on push it diffs against the previous
      # commit. Filters mirror the old workflow-level paths lists.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.3
        id: filter
        with:
          filters: |
            changed:
              - 'packages/matchmaking/**'
              - 'packages/core/**'
              - '.github/workflows/matchmaking-ci.yml'
              - 'specs/006-match-lifecycle-matchmaking/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'biome.jsonc'
              - 'packages/engine/**'
              - 'packages/terrain/**'
              - 'packages/networking/**'
              - 'packages/logging/**'
              - 'packages/version/**'
  matchmaking-lint:
    name: Lint (matchmaking)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      # Matchmaking runtime-imports @europa/engine + @europa/terrain and
      # type-imports @europa/networking; build every workspace dep's dist
      # before touching the package.
      - name: Build @europa/version (workspace dependency)
        run: pnpm --filter @europa/version build

      - name: Build @europa/core (workspace dependency)
        run: pnpm --filter @europa/core build

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/terrain (workspace dependency)
        run: pnpm --filter @europa/terrain build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Build @europa/logging (workspace dependency)
        run: pnpm --filter @europa/logging build

      - name: Build @europa/networking (workspace dependency)
        run: pnpm --filter @europa/networking build

      - name: Typecheck (matchmaking)
        run: pnpm --filter @europa/matchmaking typecheck

      - name: Lint (matchmaking)
        run: pnpm --filter @europa/matchmaking lint

      - name: Format check (matchmaking)
        run: pnpm --filter @europa/matchmaking format:check

  matchmaking-test:
    name: Test (matchmaking)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Build @europa/version (workspace dependency)
        run: pnpm --filter @europa/version build

      - name: Build @europa/core (workspace dependency)
        run: pnpm --filter @europa/core build

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/terrain (workspace dependency)
        run: pnpm --filter @europa/terrain build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Build @europa/logging (workspace dependency)
        run: pnpm --filter @europa/logging build

      - name: Build @europa/networking (workspace dependency)
        run: pnpm --filter @europa/networking build

      - name: Test (matchmaking)
        run: pnpm --filter @europa/matchmaking test

      # Explicit gates so a missing/renamed script fails loudly in CI
      # even if the umbrella `test` glob ever drifts.
      - name: Conformance (upstream shape drift catch)
        run: pnpm --filter @europa/matchmaking test:conformance

      # Feature 010 lobby contract witnesses (runtime half; type half is
      # `pnpm typecheck:conformance` over tsconfig.conformance.json).
      # Follows the console conformance precedent: build the library
      # first, then run the targeted vitest suite so barrel reads from
      # `dist/` and a missing/renamed file fails loudly.
      - name: Build @europa/matchmaking (lobby contract barrel)
        run: pnpm --filter @europa/matchmaking build

      - name: Lobby conformance (feature 010 contract witnesses)
        run: pnpm --filter @europa/matchmaking test:lobby-conformance

      - name: 'Soak (SC-005: 50 cycles, no leaks)'
        run: pnpm --filter @europa/matchmaking test:soak

  matchmaking-coverage:
    name: Coverage gate (matchmaking ≥ 80%)
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: 'node@22'
          cache: true
          require-lockfile: true

      - name: Build @europa/version (workspace dependency)
        run: pnpm --filter @europa/version build

      - name: Build @europa/core (workspace dependency)
        run: pnpm --filter @europa/core build

      - name: Build @europa/engine (workspace dependency)
        run: pnpm --filter @europa/engine build

      - name: Build @europa/terrain (workspace dependency)
        run: pnpm --filter @europa/terrain build

      - name: Build @europa/fog (workspace dependency)
        run: pnpm --filter @europa/fog build

      - name: Build @europa/logging (workspace dependency)
        run: pnpm --filter @europa/logging build

      - name: Build @europa/networking (workspace dependency)
        run: pnpm --filter @europa/networking build

      - name: Coverage (matchmaking)
        run: pnpm --filter @europa/matchmaking test:coverage

      # Coverage thresholds (80% lines/functions/branches/statements) are
      # enforced by vitest config at packages/matchmaking/vitest.config.ts.
      # The command exits non-zero if any threshold is below 80%.

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matchmaking-coverage
          path: packages/matchmaking/coverage/
          retention-days: 14
